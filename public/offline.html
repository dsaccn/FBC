<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — MEBA TECH PRO POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A1408;
      color: #F5F0E6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      padding: 40px 24px;
      max-width: 420px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(201, 168, 76, 0.25);
      background: rgba(201, 168, 76, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #C9A84C;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 14px;
      color: #BFB49A;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .status-box {
      margin: 28px 0;
      padding: 16px 20px;
      background: rgba(220,38,38,0.08);
      border: 1px solid rgba(220,38,38,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .note {
      font-size: 12px;
      color: #8B7A5E;
      margin-top: 20px;
      line-height: 1.7;
    }
    button {
      margin-top: 24px;
      padding: 12px 28px;
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 8px;
      color: #C9A84C;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    button:hover { background: rgba(201, 168, 76, 0.15); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Server Starting Up</h1>
    <p>The POS server is not reachable right now.</p>
    <p>This usually happens right after power is restored — the server needs a moment to start.</p>

    <div class="status-box">
      <div class="dot"></div>
      <span>Waiting for server to come online…</span>
    </div>

    <p class="note">
      Your data is safe and saved locally.<br/>
      All orders taken before the power went out are still there.
    </p>

    <button onclick="window.location.reload()">Try Again</button>
  </div>

  <script>
    // Auto-retry every 5 seconds
    let attempts = 0;
    const check = setInterval(async () => {
      attempts++;
      try {
        const res = await fetch('/api/sync', { method: 'GET' });
        if (res.ok) {
          clearInterval(check);
          window.location.href = '/dashboard/tables';
        }
      } catch {}

      // Give up auto-retry after 2 minutes, let user click manually
      if (attempts >= 24) clearInterval(check);
    }, 5000);
  </script>
</body>
</html>
