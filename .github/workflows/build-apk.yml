name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-scanner
          name: "Kogna Verifier Native App v2.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Native Android App v2.0.0
            
            100% Standalone Native Android application for Kogna Coffee waitstaff and cashiers.
            
            ### ✨ What's New in v2.0.0:
            - **100% Pure Native App**: Zero WebViews, zero browser shells, zero web loading bars. Boots instantly in 0.00 seconds.
            - **Hardware CameraX/ZXing**: High-speed real-time continuous camera scanning directly on GPU surface.
            - **Direct On-Device Verification**: Scrapes and verifies Telebirr and CBE receipts directly over the phone's Ethiopian IP address, eliminating overseas cloud proxy timeouts ("Gateway Delay").
            - **In-App Refresh Button**: Reconnects to POS, syncs pending offline scans, and resets scanner with a single tap.
            - **Sensory Audio & Haptic Feedback**: Native chime tones and haptic vibration on receipt verification.
            - **Offline-First Resilience**: Scans and verifies even if POS server is unreachable, automatically queuing receipts for background sync.
            
            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android phone.
            2. Tap to install (enable *"Install unknown apps"* if prompted).
            3. Open the app to start scanning Telebirr and CBE receipts!
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
