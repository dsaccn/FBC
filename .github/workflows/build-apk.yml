name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Run Unit Tests
        working-directory: android-scanner
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.1-scanner
          name: "Kogna Verifier App v2.5.1"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.5.1

            ### 🛠️ Verification Stability & Security Fixes:
            - **Hedged Verification with Automatic Fallback**:
              - Verification queries the official bank gateway directly with a 2-second hedging timer.
              - If the bank gateway does not respond within 2 seconds or encounters errors, the app concurrently queries the Cashier PC POS endpoints (`activePosUrl`, `DEFAULT_LOCAL_URL`, `DEFAULT_TUNNEL_URL`).
              - First authoritative verdict (genuine payment, duplicate, wrong receiver, or underpayment) wins and cancels competing requests.
              - All routes must fail before an unverified failure is reported.
            - **Telebirr Gateway Resilience**:
              - DNS resolution now queries system DNS first with fallback to `196.188.116.120` on `UnknownHostException` (unresponsive `.121` removed).
              - Shorter per-call timeouts (5s connect, 8s read) with automatic single retry on network failure or 5xx responses.
              - Transaction status check now parses non-standard HTML table structure (`transaction status` cell without closing tag) requiring `completed|success|approved`.
            - **CBE Verification Fixes**:
              - Corrected field mappings for modern v2 API responses (`creditAccountNo`, `creditAccountHolder`, `debitAccountHolder`, `debitAccountNo`, `amountCredited`, `status`, `dateTimes[0]`).
              - Legacy `FT` slips bypass direct device query and route to Cashier PC PDF parser, displaying clear guidance when Cashier PC is unreachable.
            - **Masked Account & Phone Matching**:
              - Implemented prefix/suffix matching and international dial code normalization (`251` ↔ `0`) for masked accounts across Telebirr and CBE.
            - **Test Automation & Architecture**:
              - Modularized parsing and validation logic into `ReceiptParser` with unit tests running in CI prior to build.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
