name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Run Unit Tests
        working-directory: android-scanner
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.2-scanner
          name: "Kogna Verifier App v2.5.2"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.5.2

            ### 🔄 New Features & Workflow Improvements:
            - **↻ Try Again Button on Failure Cards**:
              - Added a visible retry button on error/unverified cards.
              - Re-runs the verification pipeline for the last scanned payload immediately without requiring cashier to re-aim camera.
            - **Post-Scan Table Linking Contract Fix (Bug A)**:
              - Corrected response handling for `linkedOrder != null` from Cashier PC sync.
              - Accurately confirms order linking on screen and closes table picker to prevent duplicate submissions.
            - **Cashier PC Sync Status Updates (Bug B)**:
              - Authoritative duplicate, wrong-receiver, and underpayment responses from Cashier PC now update the result card and badge in place.
            - **Stale Reference Safeguard (Bug C)**:
              - Cleared verified transaction data and hid post-scan table picker on failed scans and scanner reset to prevent associating previous slip with new tables.
            - **Multi-Endpoint Fallback for Table Linking (Bug D)**:
              - Table linking requests now sequentially try `activePosUrl` -> `DEFAULT_LOCAL_URL` -> `DEFAULT_TUNNEL_URL` with in-flight double-tap protection.
            - **Security Hardening (Bug E)**:
              - Enforced `isScannerAuthorized` authentication check on `POST /api/scanner/verify-order`.
            - **Settings Safeguard (Item F)**:
              - Added warning banner if scanner token is rejected and preserved cached receiver accounts.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
