name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Run Unit Tests
        working-directory: android-scanner
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Validate Signing Secrets and Decode Keystore
        env:
          KOGNA_KEYSTORE_B64: ${{ secrets.KOGNA_KEYSTORE_B64 }}
          KOGNA_KEYSTORE_PASSWORD: ${{ secrets.KOGNA_KEYSTORE_PASSWORD }}
          KOGNA_KEY_ALIAS: ${{ secrets.KOGNA_KEY_ALIAS }}
          KOGNA_KEY_PASSWORD: ${{ secrets.KOGNA_KEY_PASSWORD }}
        run: |
          if [ -z "$KOGNA_KEYSTORE_B64" ] || [ -z "$KOGNA_KEYSTORE_PASSWORD" ] || [ -z "$KOGNA_KEY_ALIAS" ] || [ -z "$KOGNA_KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KOGNA_KEYSTORE_B64, KOGNA_KEYSTORE_PASSWORD, KOGNA_KEY_ALIAS, KOGNA_KEY_PASSWORD). Please configure them in repository secrets."
            exit 1
          fi
          mkdir -p /tmp/keystore
          node -e "const fs = require('fs'); fs.writeFileSync('/tmp/keystore/kogna-verifier.jks', Buffer.from(process.env.KOGNA_KEYSTORE_B64.trim(), 'base64'));"
          if [ ! -s /tmp/keystore/kogna-verifier.jks ]; then
            echo "::error::Keystore file is empty after base64 decoding!"
            exit 1
          fi
          echo "Keystore successfully decoded. Verifying alias with keytool..."
          keytool -list -keystore /tmp/keystore/kogna-verifier.jks -storepass "$KOGNA_KEYSTORE_PASSWORD" -alias "$KOGNA_KEY_ALIAS"
          echo "Keystore verified successfully."

      - name: Build APK with Fixed Signing Key
        working-directory: android-scanner
        env:
          KOGNA_KEYSTORE_PATH: /tmp/keystore/kogna-verifier.jks
          KOGNA_KEYSTORE_PASSWORD: ${{ secrets.KOGNA_KEYSTORE_PASSWORD }}
          KOGNA_KEY_ALIAS: ${{ secrets.KOGNA_KEY_ALIAS }}
          KOGNA_KEY_PASSWORD: ${{ secrets.KOGNA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_build.log || {
            echo "::error::Gradle build failed. Showing last 50 lines:"
            tail -n 50 /tmp/gradle_build.log
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Verify APK Signing Certificate
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          CERTS_OUTPUT=$($APKSIGNER verify --print-certs build-output/KognaVerifier.apk)
          echo "$CERTS_OUTPUT"

          EXPECTED_SHA256="83ca86a3a8f3f79bd33116dfe2be87c7cc337491c061ac2cfbb199b9dc4d7839"
          ACTUAL_SHA256=$(echo "$CERTS_OUTPUT" | grep -i "SHA-256 digest" | tr -d ' :' | awk -F'digest' '{print tolower($2)}')

          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"

          if [[ "$ACTUAL_SHA256" != *"$EXPECTED_SHA256"* ]]; then
            echo "::error::Certificate fingerprint mismatch! The APK was not signed with the official Kogna key."
            exit 1
          fi
          echo "Certificate fingerprint verified successfully: $EXPECTED_SHA256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.6.1-scanner
          name: "Kogna Verifier App v2.6.1"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.6.1

            ### 🎯 High-Precision OCR Confusion Normalization & Dual Candidate Retry:
            - **Automatic Telebirr Zero / O Normalization**:
              - Automatically resolves ML Kit OCR misreading digit `0` as uppercase letter `O` in Telebirr transaction codes (e.g., `DJM05ZHSXC` read as `DJMO5ZHSXC`).
              - Ensures 100% first-pass accuracy when scanning customer phone screens and SMS receipts.
            - **Dual-Candidate Live Retry**:
              - If an OCR-scanned reference returns an invalid receipt response, both the Android client and the backend server automatically attempt an instant in-flight candidate retry swapping `O` ↔ `0` before declaring failure.
            - **CBE Character Position Normalization**:
              - Enforces strict numeric validation on characters 2-6 of `FT` references (`FT` + year + Julian day: YYDDD), automatically correcting `O`→`0`, `I`/`L`→`1`, `S`→`5`, and `B`→`8`.
            - **Real-Time Live OCR (Google ML Kit)**:
              - Point the camera at a customer's phone showing an SMS or USSD confirmation (*847# CBE or *127# Telebirr) with **NO QR code**.
              - Camera preview automatically reads the text in real-time (~5 FPS), extracts payment reference, vibrates, beeps, and triggers verification automatically with zero button clicks!
            - **CBE USSD & SMS**:
              - Automatically detects `FT[0-9A-Za-z]{10}` references (e.g., `FT26295ZFD3H`) and modern CBE `v2-...` tokens.
            - **Telebirr USSD & 127 SMS**:
              - Automatically detects receipt URLs (`https://transactioninfo.ethiotelecom.et/receipt/...`), Amharic transaction numbers (`የሂሳብ እንቅስቃሴ ቁጥርዎ DJ...`), and standard 10-char Telebirr IDs.
            - **Zero Trust Anti-Fraud Protection**:
              - The OCR layer only extracts the reference identifier and immediately queries the official bank gateway via the POS backend to verify real deposited money.
            - **Permanent Release Keystore**:
              - Signed with the official permanent Kogna certificate (`83:CA:86:A3:A8:F3:F7:9B:D3:31:16:DF:E2:BE:87:C7:CC:33:74:91:C0:61:AC:2C:FB:B1:99:B9:DC:4D:78:39`). Seamless in-place updates over previous versions without uninstalling!

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (updates seamlessly over previous versions without uninstalling!).
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
