name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.0-scanner
          name: "Kogna Verifier App v2.4.0 (Parallel Multi-Request Racing Engine & Direct DNS)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.4.0

            ### 🏎️ Parallel Multi-Request Racing Engine ("Fastest Route Wins"):
            - **Hedged Multi-Request Racing**: When a receipt QR is scanned, the app fires multiple parallel requests simultaneously:
              1. **Direct On-Device Bank Gateway**: Queries Telebirr or CBE directly from the phone.
              2. **Local Cashier PC**: Queries `http://192.168.1.5:3000` via café Wi-Fi in parallel.
              3. **Cloudflare Tunnel**: Queries `https://scanner.kogna.coffee` via LTE in parallel.
            - **Sub-Second Display (< 500ms)**: Whichever racer receives a verified response first **wins immediately**, pops the genuine green card with overshoot spring animations, and cancels the remaining calls.
            - **Eliminated Ethio Telecom Gateway Timeout**: Integrated authoritative direct IP DNS resolution (`196.188.116.120`) inside OkHttp, eliminating 5-second DNS hangs on Ethiopian cellular networks.
            - **Zero False Failures**: If one network drops packets or hits a gateway lag, the other racers in flight automatically rescue the verification with zero user intervention.
            - **Background Order & Table Sync**: Asynchronously syncs the slip and links open table orders on the Cashier PC without blocking the UI.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Enjoy instant, fail-proof payment verification!
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
