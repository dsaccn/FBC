name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.0-scanner
          name: "Kogna Verifier App v2.2.0 (Receiver Check & Table Linking)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.2.0

            ### 🛡️ Critical Updates & Features:
            - **Strict Receiver Verification**: Cross-references Telebirr and CBE receiver phone/account numbers with official store settings. Fraudulent receipts or payments sent to other accounts are immediately flagged with `❌ RECEIVER MISMATCH` and rejected!
            - **Real-Time Table Linking**: Verified payments automatically link to target tables and broadcast `ORDER_VERIFIED` to the Cashier PC screen, marking them as PAID in 0 ms.
            - **Quick Post-Scan Table Picker**: If a receipt is scanned without pre-selecting a table, horizontal 1-tap table chips (`Table 1`, `Table 2`, etc.) appear right on the result card for instant Cashier linking.
            - **Dual Engine Toggle (Native + Web Scanner Link)**: Tap the 🌐 icon in the top bar to toggle between the ⚡ 100% Native Hardware Camera and the 🌐 Full Web Scanner Link engine.
            - **Zero-Delay Slip Fetching**: Direct Ethiopian network connectivity bypasses overseas cloud gateway delays.
            - **Duplicate & Underpayment Protection**: Rejects already-used transaction IDs and prevents linking receipts where the paid amount is less than the bill.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Open to scan Telebirr and CBE QR codes directly.
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
