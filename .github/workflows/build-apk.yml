name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0-scanner
          name: "Kogna Verifier App v2.5.0 (100% Phone-Only Direct Bank Verification)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.5.0

            ### ⚡ 100% Phone-Only Direct Bank Verification:
            - **Removed Intermediate Verification Racers**:
              - Completely removed Racer 2 (Local Wi-Fi Cashier PC) and Racer 3 (Cloudflare Tunnel) from the payment verification step.
              - The phone queries bank gateways directly without waiting for or touching any intermediate servers.
            - **Direct Telebirr & CBE Gateway Connections**:
              - **Telebirr**: Phone queries `https://transactioninfo.ethiotelecom.et/receipt/{ref}` directly using authoritative direct IP DNS (`196.188.116.120`), completely bypassing DNS lookup lags.
              - **CBE**: Phone queries `https://mb.cbe.com.et/api/v1/transactions/public/transaction-detail/{ref}` directly using public bank mobile API headers.
            - **Instant Verified Card Display (< 500ms)**:
              - Verified genuine result card renders immediately on device with spring animations and merchant account security checks.
            - **Non-Blocking Background POS Sync**:
              - Order linking and table status updates are dispatched asynchronously in the background to the Cashier PC without blocking the phone or cashier.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Enjoy instant, fail-proof phone-only direct payment verification!
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
