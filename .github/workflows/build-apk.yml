name: Build Kogna Verifier APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-scanner/gradlew

      - name: Build Debug APK
        working-directory: android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk build-output/KognaVerifier.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KognaVerifier-APK
          path: build-output/KognaVerifier.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.2-scanner
          name: "Kogna Verifier App v2.2.2 (100% Reliable Scanner & Dual Failover)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kogna Verifier Android App v2.2.2

            ### 🛡️ Critical Fixes & Improvements:
            - **Eliminated "Cannot Reach Cashier PC" Delay**: Added automatic dual-endpoint failover between Cloudflare Tunnel and Local Wi-Fi (`http://192.168.1.5:3000`). If one network is slow or unreachable, it instantly tries the other in milliseconds.
            - **High-Performance In-Flight Retries**: Added transparent 2-attempt retry loop on device for Ethio Telecom slips, preventing packet drop failures on mobile networks.
            - **Universal Ethiopian Payment QR Engine**: Comprehensive regex matching for CBE v2 URLs/tokens (stripping `?type=qr`), legacy CBE FT codes, Telebirr URLs, SuperApp Base64 EMVCo QR, and SMS strings.
            - **9-Digit Receiver Normalization**: Automatically normalizes Ethiopian phone formats (`251...` vs `09...`) so masked numbers match reliably without false receiver mismatch rejections.
            - **ZXing Fast Continuous Autofocus & Inverted Mode**: Added mixed normal/inverted luminance decoding for fast QR scanning on dark-mode phone screens and low-contrast displays.
            - **Zero-Delay Slip Fetching**: Direct Ethiopian network connectivity bypasses overseas cloud gateway delays.
            - **Duplicate & Underpayment Protection**: Rejects already-used transaction IDs and prevents linking receipts where the paid amount is less than the bill.

            ### 📥 Download & Install:
            1. Download **`KognaVerifier.apk`** below to your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Open to scan Telebirr and CBE QR codes directly.
          files: build-output/KognaVerifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
