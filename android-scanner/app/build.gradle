apply plugin: 'com.android.application'

// Load keystore.properties if it exists (local machine fallback)
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'coffee.kogna.verifier'
    compileSdk 34

    defaultConfig {
        applicationId "coffee.kogna.verifier"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "2.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        kogna {
            // 1. Environment variables (CI / build server)
            def ksPath = System.getenv("KOGNA_KEYSTORE_PATH")
            // 2. keystore.properties file (local machine)
            if (!ksPath && keystoreProps['storeFile']) ksPath = keystoreProps['storeFile']

            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KOGNA_KEYSTORE_PASSWORD") ?: keystoreProps['storePassword']
                keyAlias     System.getenv("KOGNA_KEY_ALIAS")          ?: keystoreProps['keyAlias']
                keyPassword  System.getenv("KOGNA_KEY_PASSWORD")        ?: keystoreProps['keyPassword']
                storeType    "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (signingConfigs.kogna.storeFile != null ? signingConfigs.kogna : signingConfigs.debug)
        }
        debug {
            // Always use the Kogna keystore so APK signatures are consistent across machines
            signingConfig (signingConfigs.kogna.storeFile != null ? signingConfigs.kogna : signingConfigs.debug)
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
